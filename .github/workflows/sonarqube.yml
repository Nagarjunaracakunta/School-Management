name: SonarQube

# Static analysis and the quality gate. It needs EVERY service's coverage at once (SonarQube judges the whole project), so
# unlike ci.yml it always runs all tests; they use the fast SQLite mode and take about a minute in parallel.
# Pull requests from forks are skipped: GitHub does not give them our secrets, and they must not.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: coverage (${{ matrix.service }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [auth, admission, student, fee, attendance, notification]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r services/${{ matrix.service }}/requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider
        working-directory: services/${{ matrix.service }}
      - name: Make file names relative to the repository root
        run: python3 scripts/ci/prefix_coverage.py services/${{ matrix.service }}/coverage.xml services/${{ matrix.service }}/app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          retention-days: 1

  coverage-frontend:
    name: coverage (frontend)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage-frontend
          path: frontend/coverage/lcov.info
          retention-days: 1

  sonarqube:
    name: scan and quality gate
    needs: [coverage, coverage-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarQube needs history to find who changed a line and what is "new code"
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonar-coverage-*
          path: coverage-in
      - name: Put each report where sonar-project.properties expects it
        run: |
          set -eu
          for s in auth admission student fee attendance notification; do
            cp "coverage-in/sonar-coverage-$s/coverage.xml" "services/$s/coverage.xml"
          done
          mkdir -p frontend/coverage
          cp coverage-in/sonar-coverage-frontend/lcov.info frontend/coverage/lcov.info
      - name: Analyse
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }} # an address, not a secret
      - name: Fail the build if the quality gate failed
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
