name: Update deployment configuration

# CI never touches the cluster. "Deploying" means CHANGING A LINE IN GIT: the image tag in helm/environments/<env>/*.yaml.
# Argo CD, running inside the cluster, sees the commit and makes the cluster match.
#
#   dev    automatic: when images were pushed to ECR, a bot commit puts their tags into dev's values.
#   stage / prod   on request (Run workflow): copies the tags from the previous environment into a pull request.
#                  Merging that pull request IS the approval (CODEOWNERS decides who may merge it).
on:
  workflow_run:
    workflows: ["Build and push images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      from_env:
        description: Environment whose tags are copied
        type: choice
        options: [dev, stage]
        default: dev
      to_env:
        description: Environment to update (through a pull request)
        type: choice
        options: [stage, prod]
        default: stage

permissions:
  contents: read

jobs:
  dev:
    name: bump dev
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # pushes the one-line change; this job cannot touch AWS or the cluster
    concurrency:
      group: update-deployment-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the tip of main, not the commit that was built: other bumps may have landed meanwhile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: builds
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Put the new tags into dev's values
        run: python3 scripts/ci/bump_image_tag.py from-builds --env dev --dir builds
      - name: Commit and push (a re-run with nothing new commits nothing)
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          git diff --quiet && { echo "dev already runs these images"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): images built from ${SOURCE_SHA::7}" -m "Build: ${RUN_URL}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main # someone else pushed first: rebase our one-line change on top
          done
          exit 1

  promote:
    name: promote ${{ inputs.from_env }} to ${{ inputs.to_env }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: The order is dev, then stage, then prod
        env:
          FROM: ${{ inputs.from_env }}
          TO: ${{ inputs.to_env }}
        run: |
          case "$FROM>$TO" in
            "dev>stage"|"stage>prod") ;;
            *) echo "::error::promote dev to stage, or stage to prod. Never skip an environment."; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Copy the tags
        env:
          FROM: ${{ inputs.from_env }}
          TO: ${{ inputs.to_env }}
        run: python3 scripts/ci/bump_image_tag.py promote --from "$FROM" --to "$TO"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ inputs.from_env }}
          TO: ${{ inputs.to_env }}
        run: |
          set -eu
          git diff --quiet && { echo "$TO already runs what $FROM runs"; exit 0; }
          branch="promote/${TO}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "deploy(${TO}): promote what ${FROM} runs"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Deploy to ${TO}: promote what ${FROM} runs" \
            --body "Copies the image tags of **${FROM}** into **${TO}**. Review the diff: it must contain only \`tag:\` lines. Merging this pull request tells Argo CD to deploy (in prod, a person then presses Sync)."
