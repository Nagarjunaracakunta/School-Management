# Local stand-in for CloudFront + ALB.  Browser -> nginx (:8080) -> {static files | service containers}.
#
# Docker's DNS server (127.0.0.11) plus a variable in proxy_pass makes nginx look the service name up on each request.
# Without that, nginx would refuse to START whenever one backend container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    include /etc/nginx/snippets/security-headers.inc;

    # ---- API routing: the same rules the ALB / Kubernetes Ingress will apply (Phase 14/15) ----------------------
    # ORDER MATTERS: nginx takes the first matching regex. Sub-resources of a student or teacher belong to the
    # service that owns that data, even though the path starts with /students or /teachers.
    location ~ ^/api/v1/students/[^/]+/fees          { set $up http://fee:8000;          include /etc/nginx/snippets/proxy.inc; }
    location ~ ^/api/v1/students/[^/]+/attendance    { set $up http://attendance:8000;   include /etc/nginx/snippets/proxy.inc; }
    location ~ ^/api/v1/teachers/[^/]+/attendance    { set $up http://attendance:8000;   include /etc/nginx/snippets/proxy.inc; }
    location ~ ^/api/v1/(fees|fee-structures|payments)(/|$)   { set $up http://fee:8000;         include /etc/nginx/snippets/proxy.inc; }
    location ~ ^/api/v1/attendance(/|$)              { set $up http://attendance:8000;   include /etc/nginx/snippets/proxy.inc; }
    location ~ ^/api/v1/notifications(/|$)           { set $up http://notification:8000; include /etc/nginx/snippets/proxy.inc; }
    location ~ ^/api/v1/admissions(/|$)              { set $up http://admission:8000;    include /etc/nginx/snippets/proxy.inc; }
    location ~ ^/api/v1/(students|classes|sections|subjects|teachers)(/|$) { set $up http://student:8000; include /etc/nginx/snippets/proxy.inc; }
    location ~ ^/api/v1/(auth|users)(/|$)            { set $up http://auth:8000;         include /etc/nginx/snippets/proxy.inc; }
    location = /.well-known/jwks.json                { set $up http://auth:8000;         include /etc/nginx/snippets/proxy.inc; }

    # Anything else under /api is a typo, not a page: answer in the same JSON error format the services use.
    location /api/ {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.inc;
        return 404 '{"error":{"code":"not_found","message":"Unknown API path","request_id":"$request_id","details":null}}';
    }

    # ---- Static files ---------------------------------------------------------------------------------------------
    # Build output has a content hash in its file name, so it can be cached "forever"; a new build = new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri =404;
    }

    # The single-page app: unknown paths (like /payments on refresh) get index.html and React Router takes over.
    # CloudFront does the same with a CloudFront Function on the static-file behavior (NOT with custom error responses,
    # which would also rewrite API errors; see ADR 0006, D53).
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files $uri /index.html;
    }
}
