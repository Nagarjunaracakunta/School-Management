apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.global.migrationServiceAccount }}
  labels:
    app.kubernetes.io/name: db-migrator
    app.kubernetes.io/part-of: school
    app.kubernetes.io/managed-by: {{ .Release.Service }}
# Linked by Terraform (EKS Pod Identity) to the db-migrator IAM role: the ONLY role allowed to read the database administrator login
# and the schema-changing logins. Used by the bootstrap job below and by every service's migration job.
automountServiceAccountToken: false
