{{- if .Values.autoscaling.enabled }}
# Needs metrics-server in the cluster (installed in Phase 15, see helm/addons).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "school.name" . }}
  labels:
    {{- include "school.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "school.name" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # wait 5 minutes of low load before removing pods: avoids flapping
    scaleUp:
      stabilizationWindowSeconds: 0
{{- end }}
