{{- if .Values.networkPolicy.enabled }}
{{- $vpc := required "global.vpcCidr is required for the network policy" .Values.global.vpcCidr }}
# The namespace denies everything by default (helm/school-platform). This policy opens exactly what THIS service needs.
# It applies to every pod of the service: API, worker, migration job, cron jobs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "school.name" . }}
  labels:
    {{- include "school.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "school.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.ingress.enabled }}
    # The load balancer (target-type ip sends traffic from its own addresses inside the VPC)
    - from:
        - ipBlock:
            cidr: {{ $vpc }}
      ports:
        - { protocol: TCP, port: {{ .Values.containerPort }} }
    {{- end }}
    {{- range .Values.networkPolicy.callers }}
    # Another school service that calls this one over REST
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
              app.kubernetes.io/part-of: school
      ports:
        - { protocol: TCP, port: {{ $.Values.containerPort }} }
    {{- end }}
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # The EKS Pod Identity agent on the node. FORGET THIS and every AWS call fails with "no credentials", silently.
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - { protocol: TCP, port: 80 }
    # PostgreSQL (the database lives in the VPC's database subnets)
    - to:
        - ipBlock:
            cidr: {{ $vpc }}
      ports:
        - { protocol: TCP, port: 5432 }
    # AWS APIs: Secrets Manager, SQS, SNS (HTTPS). Not the cluster's own address range.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [{{ $vpc }}]
      ports:
        - { protocol: TCP, port: 443 }
    # ... or through VPC endpoints, which have addresses inside the VPC
    - to:
        - ipBlock:
            cidr: {{ $vpc }}
      ports:
        - { protocol: TCP, port: 443 }
    {{- range .Values.networkPolicy.calls }}
    # A school service this one calls over REST
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
              app.kubernetes.io/part-of: school
      ports:
        - { protocol: TCP, port: {{ $.Values.containerPort }} }
    {{- end }}
{{- end }}
