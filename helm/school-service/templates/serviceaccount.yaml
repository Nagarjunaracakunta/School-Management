apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "school.serviceAccountName" . }}
  labels:
    {{- include "school.labels" (dict "root" . "component" "api") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No IAM annotation: EKS Pod Identity links this service account to its IAM role from OUTSIDE (the association Terraform made), by
# namespace + name. That is why this name must equal the service name.
automountServiceAccountToken: false # pods never talk to the Kubernetes API, so they get no token for it
