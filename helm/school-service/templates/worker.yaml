{{- if .Values.worker.enabled }}
# The queue consumer: the SAME image as the API with a different command. No port, no Service, no Ingress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "school.name" . }}-worker
  labels:
    {{- include "school.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "school.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "school.labels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "school.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }} # on SIGTERM the worker finishes its batch
      securityContext:
        {{- include "school.podSecurityContext" . | nindent 8 }}
      containers:
        - name: {{ include "school.name" . }}-worker
          image: {{ include "school.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.worker.command }}
          envFrom:
            - configMapRef:
                name: {{ include "school.name" . }}
          env:
            - name: HEARTBEAT_FILE
              value: {{ .Values.worker.heartbeatFile | quote }}
          securityContext:
            {{- include "school.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          # The worker has no HTTP port. It proves it is alive by touching a file on every loop; if the file goes stale
          # the process is stuck and Kubernetes restarts it.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('{{ .Values.worker.heartbeatFile }}')<{{ .Values.worker.heartbeatMaxAgeSeconds }} else 1)"
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            {{- include "school.tmpMount" . | nindent 12 }}
      volumes:
        {{- include "school.tmpVolume" . | nindent 8 }}
{{- end }}
