# One SonarQube project for the whole monorepo. Server address and token are NOT here: CI passes SONAR_HOST_URL and
# SONAR_TOKEN from GitHub secrets.
sonar.projectKey=school-management
sonar.projectName=School Management Platform

sonar.sources=services/auth/app,services/admission/app,services/student/app,services/fee/app,services/attendance/app,services/notification/app,lambdas/notification_delivery,tools/db-bootstrap,frontend/src
sonar.tests=services/auth/tests,services/admission/tests,services/student/tests,services/fee/tests,services/attendance/tests,services/notification/tests,lambdas/notification_delivery/tests,tools/db-bootstrap/tests,frontend/src
sonar.test.inclusions=**/tests/**,**/*.test.js,**/*.test.jsx
sonar.exclusions=**/*.test.js,**/migrations/**,**/node_modules/**,**/dist/**,**/__pycache__/**

# Analysed for quality, but not part of the coverage percentage (their tests run in their own jobs).
sonar.coverage.exclusions=lambdas/**,tools/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=services/auth/coverage.xml,services/admission/coverage.xml,services/student/coverage.xml,services/fee/coverage.xml,services/attendance/coverage.xml,services/notification/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Copy-paste detection is noisy across six services built on the same pattern (routers, repositories, settings).
sonar.cpd.exclusions=services/*/app/config/**,services/*/app/utils/**
sonar.sourceEncoding=UTF-8
